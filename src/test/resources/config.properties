# Application Configuration
baseUrl=https://automationexercise.com
apiBaseUrl=https://automationexercise.com/api

# Browser & Execution Settings
browser=chrome
headless=true
explicitWait=15
pageLoadTimeout=30
screenshotOnFailure=true

# Database Settings (JDBC Test Result Logging)
# db.mode: 'auto' will attempt MySQL connection; if unreachable, gracefully falls back to embedded in-memory H2
db.mode=auto
db.mysql.url=jdbc:mysql://localhost:3306/qa_automation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.username=root
db.mysql.password=root
db.h2.url=jdbc:h2:mem:qa_automation;DB_CLOSE_DELAY=-1;MODE=MySQL
db.h2.username=sa
db.h2.password=

# Reporting Settings
extentReportPath=target/extent-reports/ExtentReport.html
extentReportTitle=Automation Exercise - QA Automation Execution Report
extentReportName=Regression Test Execution Summary
